name: CI

on:
  push:
    branches-ignore: [ci-results]
  pull_request:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: hms_ci_password
          POSTGRES_DB: hms_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hms" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      HMS_TEST_PG: "Host=localhost;Port=5432;Username=hms;Password=hms_ci_password;Database=hms_ci"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Environment info
        run: |
          mkdir -p ci-output
          { dotnet --info; which pg_dump psql pg_restore; pg_dump --version; } > ci-output/env.log 2>&1 || true
      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update -y >/dev/null && sudo apt-get install -y postgresql-client-16 >/dev/null 2>&1 || true
          ls /usr/lib/postgresql >> ci-output/env.log 2>&1 || true
      - name: Generate EF migration (on request)
        if: hashFiles('tools/migration-request.txt') != ''
        run: |
          set -o pipefail
          dotnet tool install --global dotnet-ef --version "10.*" > ci-output/migration.log 2>&1 || true
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet restore BurhanNexus.HMS.slnx >> ci-output/migration.log 2>&1
          NAME=$(head -n1 tools/migration-request.txt | tr -d '\r\n ')
          if ! ls src/BurhanNexus.HMS.Infrastructure/Persistence/Migrations/*_"$NAME".cs >/dev/null 2>&1; then
            dotnet ef migrations add "$NAME" \
              --project src/BurhanNexus.HMS.Infrastructure \
              --startup-project src/BurhanNexus.HMS.Web \
              --output-dir Persistence/Migrations >> ci-output/migration.log 2>&1 || echo "MIGRATION FAILED" >> ci-output/migration.log
            mkdir -p ci-output/generated
            cp -r src/BurhanNexus.HMS.Infrastructure/Persistence/Migrations ci-output/generated/ 2>/dev/null || true
          else
            echo "Migration $NAME already exists" >> ci-output/migration.log
          fi
      - name: Build
        run: |
          set -o pipefail
          dotnet build BurhanNexus.HMS.slnx -c Release 2>&1 | tee ci-output/build.log
      - name: Test
        run: |
          set -o pipefail
          dotnet test BurhanNexus.HMS.slnx -c Release --no-build --logger "console;verbosity=normal" 2>&1 | tee ci-output/test.log
      - name: UI walk-through with screenshots
        run: |
          dotnet publish src/BurhanNexus.HMS.Web -c Release -o publish/linux > ci-output/publish-linux.log 2>&1
          cd publish/linux
          export ConnectionStrings__HmsDatabase="Host=localhost;Port=5432;Username=hms;Password=hms_ci_password;Database=hms_ui"
          export Kestrel__Endpoints__Http__Url="http://127.0.0.1:5080"
          nohup dotnet BurhanNexus.HMS.Web.dll > ../../ci-output/server.log 2>&1 &
          cd ../../tools/ui-check
          npm install --no-audit --no-fund > ../../ci-output/npm.log 2>&1
          npx playwright install --with-deps chromium >> ../../ci-output/npm.log 2>&1
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:5080/health > /dev/null && break; sleep 2; done
          OUT_DIR=../../ci-output/screenshots node screenshots.mjs || true
          OUT_DIR=../../ci-output/screenshots PDF_DIR=../../ci-output/samples node phase2.mjs || true
      - name: Publish Windows server package
        run: |
          set -o pipefail
          dotnet publish src/BurhanNexus.HMS.Web -c Release -r win-x64 --self-contained true -o publish/win-x64 2>&1 | tail -n 20 | tee ci-output/publish.log
          mkdir -p publish/win-x64/deploy publish/win-x64/docs publish/win-x64/tools/print-agent
          dotnet publish tools/BurhanNexus.PrintAgent -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win-x64/tools/print-agent 2>&1 | tail -n 5 | tee -a ci-output/publish.log
          rm -f publish/win-x64/tools/print-agent/*.pdb publish/win-x64/tools/print-agent/appsettings.Development.json
          cp -r deploy/windows publish/win-x64/deploy/
          cp README.md publish/win-x64/
          cp docs/*.md publish/win-x64/docs/ 2>/dev/null || true
          rm -f publish/win-x64/appsettings.Development.json
      - name: Upload Windows server package
        uses: actions/upload-artifact@v4
        with:
          name: BurhanNexus-HMS-Server-win-x64
          path: publish/win-x64
          if-no-files-found: ignore
      - name: Push CI results
        if: always()
        run: |
          mkdir -p /tmp/res && cp -r ci-output/. /tmp/res/ 2>/dev/null || true
          cp -r tests/BurhanNexus.HMS.Tests/bin/Release/*/screenshots /tmp/res/screenshots 2>/dev/null || true
          cp ci-output/server.log /tmp/res/ 2>/dev/null || true
          echo "${GITHUB_SHA} ${{ job.status }} $(date -u)" > /tmp/res/STATUS
          cd /tmp/res
          git init -q -b ci-results
          git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
          git add -A && git commit -qm "CI results for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results

  windows-install:
    needs: build-test
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BurhanNexus-HMS-Server-win-x64
          path: package
      - name: Start PostgreSQL
        shell: pwsh
        run: |
          $svc = Get-Service -Name "postgresql*" | Select-Object -First 1
          Set-Service $svc.Name -StartupType Manual
          Start-Service $svc.Name
          Get-ChildItem "C:\Program Files\PostgreSQL"
      - name: Run server installer
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\package\deploy\windows\Install-Server.ps1 -PostgresPassword root -Port 5000 *> install.log
          Get-Content install.log
      - name: Verify installation
        shell: pwsh
        run: |
          $h = Invoke-WebRequest -UseBasicParsing http://localhost:5000/health
          "health: $($h.StatusCode) $($h.Content)" | Tee-Object -FilePath verify.log
          $s = Invoke-WebRequest -UseBasicParsing http://localhost:5000/ -MaximumRedirection 5
          if ($s.Content -notmatch "Initial Setup Wizard") { throw "Setup wizard not shown" }
          "setup wizard OK" | Tee-Object -FilePath verify.log -Append
          Get-Service BurhanNexusHMS | Format-List Name, Status, StartType | Out-String | Tee-Object -FilePath verify.log -Append
          Get-NetFirewallRule -DisplayName "Burhan Nexus HMS*" | Format-List DisplayName, Enabled, Profile | Out-String | Tee-Object -FilePath verify.log -Append
          Restart-Service BurhanNexusHMS
          Start-Sleep -Seconds 8
          "after restart: $((Invoke-WebRequest -UseBasicParsing http://localhost:5000/health).StatusCode)" | Tee-Object -FilePath verify.log -Append
      - name: Print Agent – raw printing to a Windows printer queue
        shell: pwsh
        run: |
          $log = "agent.log"
          "== Print Agent test ==" | Tee-Object -FilePath $log
          New-Item -ItemType Directory -Force -Path C:\bnprint | Out-Null
          $out = "C:\bnprint\slip.prn"
          Remove-Item $out -ErrorAction SilentlyContinue
          try {
            Add-PrinterDriver -Name "Generic / Text Only"
            Add-PrinterPort -Name $out
            Add-Printer -Name "BN Test Thermal" -DriverName "Generic / Text Only" -PortName $out
            "printer created" | Tee-Object -FilePath $log -Append
          } catch { "PRINTER SETUP FAILED: $($_.Exception.Message)" | Tee-Object -FilePath $log -Append; throw }
          powershell -ExecutionPolicy Bypass -File .\package\deploy\windows\Install-PrintAgent.ps1 -HmsUrl "http://192.168.1.10:5000" *>> $log
          $status = Invoke-RestMethod http://127.0.0.1:9123/status
          "status: $($status | ConvertTo-Json -Compress)" | Tee-Object -FilePath $log -Append
          if ($status.printers -notcontains "BN Test Thermal") { throw "Agent does not list the test printer" }
          # ESC @, centered, big "TOKEN 17", feed, cut  (same command set as the HMS slip composer)
          $bytes = [byte[]](0x1B,0x40,0x1B,0x61,0x01,0x1D,0x21,0x33) + [Text.Encoding]::ASCII.GetBytes("TOKEN 17") + [byte[]](0x0A,0x1D,0x21,0x00) + [Text.Encoding]::ASCII.GetBytes("Dr. Test`n") + [byte[]](0x1B,0x64,0x04,0x1D,0x56,0x42,0x03)
          $body = @{ printerName = "BN Test Thermal"; data = [Convert]::ToBase64String($bytes); jobName = "CI token 17" } | ConvertTo-Json
          # Preflight like Chrome (Private Network Access)
          $pre = Invoke-WebRequest -UseBasicParsing -Method Options -Uri http://127.0.0.1:9123/print/raw -Headers @{ Origin = "http://192.168.1.10:5000"; "Access-Control-Request-Method" = "POST"; "Access-Control-Request-Private-Network" = "true" }
          "preflight: $($pre.StatusCode) allow-origin=$($pre.Headers['Access-Control-Allow-Origin']) pna=$($pre.Headers['Access-Control-Allow-Private-Network'])" | Tee-Object -FilePath $log -Append
          if ($pre.Headers['Access-Control-Allow-Private-Network'] -ne "true") { throw "PNA header missing" }
          $r = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:9123/print/raw -ContentType "application/json" -Body $body -Headers @{ Origin = "http://192.168.1.10:5000" }
          "print result: $($r | ConvertTo-Json -Compress)" | Tee-Object -FilePath $log -Append
          try { Invoke-WebRequest -UseBasicParsing -Method Post -Uri http://127.0.0.1:9123/print/raw -ContentType "application/json" -Body $body -Headers @{ Origin = "http://evil.example.com" } | Out-Null; throw "foreign origin was accepted" }
          catch { if ($_.Exception.Message -eq "foreign origin was accepted") { throw }; "foreign origin rejected: OK" | Tee-Object -FilePath $log -Append }
          for ($i = 0; $i -lt 90 -and -not ((Test-Path $out) -and (Get-Item $out).Length -gt 0); $i++) {
            if ($i % 10 -eq 0) {
              "wait $i: jobs=$((Get-PrintJob -PrinterName 'BN Test Thermal' | ForEach-Object { "$($_.Id):$($_.JobStatus)" }) -join ',') printer=$((Get-Printer 'BN Test Thermal').PrinterStatus) file=$(if (Test-Path $out) { (Get-Item $out).Length } else { 'none' })" | Tee-Object -FilePath $log -Append
            }
            Start-Sleep -Milliseconds 500
          }
          Get-ChildItem C:\bnprint | Format-Table Name, Length, LastWriteTime | Out-String | Tee-Object -FilePath $log -Append
          $printed = [IO.File]::ReadAllBytes($out)
          "spooled bytes: $($printed.Length) hex: $([BitConverter]::ToString($printed))" | Tee-Object -FilePath $log -Append
          $text = [Text.Encoding]::ASCII.GetString($printed)
          if ($text -notmatch "TOKEN 17") { throw "Token text not found in printer output" }
          if ([BitConverter]::ToString($printed) -notmatch "1D-56-42-03") { throw "ESC/POS cut command was not passed through RAW" }
          "RAW ESC/POS printing via Print Agent: PASSED" | Tee-Object -FilePath $log -Append
      - name: Upload Windows install logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-logs
          path: |
            install.log
            verify.log
            agent.log
